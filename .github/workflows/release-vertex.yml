name: Release Vertex

on:
  push:
    tags: ["vertex-v*"]
  # A manual run builds both platforms and publishes nothing.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify version
        # The tag triggers the release; vertex/pyproject.toml is the
        # source of truth for the number. Refuse on mismatch so a
        # fat-fingered tag cannot ship a wrong-numbered image.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#vertex-v}"
          FILE_VERSION="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("vertex/pyproject.toml").read_text())["project"]["version"])')"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME expects version $TAG_VERSION but vertex/pyproject.toml has $FILE_VERSION"
            exit 1
          fi
          echo "VERSION=$FILE_VERSION" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine pre-release
        id: prerelease
        run: |
          if [[ "${VERSION}" == *-* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          # The build context is the repository root: the image needs
          # both shared/ and vertex/ from the uv workspace.
          context: .
          file: vertex/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          # One immutable tag per release. Terraform pins by version, so
          # no floating tag exists for a pre-release to move under a
          # customer.
          tags: ghcr.io/slashid/slashid-ai-forwarder-vertex:${{ env.VERSION }}

      - if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.value }}
          body: |
            Image: `ghcr.io/slashid/slashid-ai-forwarder-vertex:${{ env.VERSION }}`

            Terraform: `source = "git::https://github.com/slashid/slashid-ai-forwarders.git//vertex/deploy/terraform?ref=${{ github.ref_name }}"`
