---
id: converse_list_content_concatenated
messages:
  - role: assistant
    content:
      - kind: tool_use
        tool_use_id: tu_conv
        tool_name: Read
        tool_input: {file_path: "/tmp/multi.txt"}
        tool_is_error: false
  - role: user
    content:
      - kind: tool_result
        tool_use_id: tu_conv
        tool_output:
          - {text: "     1\tfoo\n"}
          - {text: "     2\tbar\n"}
        tool_is_error: false
expected:
  - name: "/tmp/multi.txt"
    byte_length: 8   # "foo\nbar\n"
    media_type: text/plain
---
id: tool_result_only_last_turn
messages:
  - role: assistant
    content:
      - kind: tool_use
        tool_use_id: tu_old
        tool_name: Read
        tool_input: {file_path: "/tmp/old.txt"}
        tool_is_error: false
  - role: user
    content:
      - kind: tool_result
        tool_use_id: tu_old
        tool_output: "old content"
        tool_is_error: false
  - role: assistant
    content:
      - kind: tool_use
        tool_use_id: tu_new
        tool_name: Read
        tool_input: {file_path: "/tmp/new.txt"}
        tool_is_error: false
  - role: user
    content:
      - kind: tool_result
        tool_use_id: tu_new
        tool_output: "new content"
        tool_is_error: false
expected:
  - name: "/tmp/new.txt"
    byte_length: 11
    media_type: text/plain
