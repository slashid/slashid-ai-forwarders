id: text_only_round_trip
req:
  contents:
    - role: user
      parts: [{text: "Reply with only the word ACK-A"}]
response:
  candidates:
    - content:
        role: model
        parts: [{text: "ACK-A"}]
      finishReason: STOP
expected:
  input:
    messages:
      - role: user
        content: [{kind: text, text: "Reply with only the word ACK-A", tool_is_error: false}]
  output:
    message:
      role: assistant
      content: [{kind: text, text: "ACK-A", tool_is_error: false}]
    stop_reason: end_turn
---
id: system_instruction_prepended_as_index_0
req:
  systemInstruction:
    parts: [{text: "You are terse. Reply with one integer, nothing else."}]
  contents:
    - role: user
      parts: [{text: "what is 2+2?"}]
    - role: model
      parts: [{text: "4"}]
    - role: user
      parts: [{text: "what is 5+7?"}]
response:
  candidates:
    - content:
        role: model
        parts: [{text: "12"}]
      finishReason: STOP
expected:
  input:
    messages:
      - role: system
        content: [{kind: text, text: "You are terse. Reply with one integer, nothing else.", tool_is_error: false}]
      - role: user
        content: [{kind: text, text: "what is 2+2?", tool_is_error: false}]
      - role: assistant
        content: [{kind: text, text: "4", tool_is_error: false}]
      - role: user
        content: [{kind: text, text: "what is 5+7?", tool_is_error: false}]
  output:
    message:
      role: assistant
      content: [{kind: text, text: "12", tool_is_error: false}]
    stop_reason: end_turn
---
id: function_call_response_round_trip
req:
  contents:
    - role: user
      parts: [{text: "What is the weather in Paris?"}]
    - role: model
      parts:
        - {functionCall: {name: get_weather, args: {city: Paris}}}
    - role: user
      parts:
        - {functionResponse: {name: get_weather, response: {weather: "sunny, 22C"}}}
  tools:
    - functionDeclarations:
        - name: get_weather
          description: Get current weather in a city
          parameters:
            type: OBJECT
            properties: {city: {type: STRING}}
            required: [city]
response:
  candidates:
    - content:
        role: model
        parts: [{text: "The weather in Paris is sunny and 22 degrees Celsius."}]
      finishReason: STOP
expected:
  input:
    messages:
      - role: user
        content: [{kind: text, text: "What is the weather in Paris?", tool_is_error: false}]
      - role: assistant
        content:
          - kind: tool_use
            tool_use_id: gemini-11dace3b8c11589f
            tool_name: get_weather
            tool_input: {city: Paris}
            tool_is_error: false
            tool_executor: client
      - role: user
        content:
          - kind: tool_result
            tool_use_id: gemini-11dace3b8c11589f
            tool_output: {weather: "sunny, 22C"}
            tool_is_error: false
            tool_executor: client
    tools_declared:
      - id: 6721ffe4c8b24359
        name: get_weather
        description: Get current weather in a city
        input_schema: '{"properties":{"city":{"type":"STRING"}},"required":["city"],"type":"OBJECT"}'
        tool_server_id: 867f60d1e44257a1
    tool_servers:
      - id: 867f60d1e44257a1
        name: builtin
        kind: runtime
  output:
    message:
      role: assistant
      content: [{kind: text, text: "The weather in Paris is sunny and 22 degrees Celsius.", tool_is_error: false}]
    stop_reason: end_turn
