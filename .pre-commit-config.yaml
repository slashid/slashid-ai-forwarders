repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # CloudFormation templates use !Ref / !Sub / !GetAtt / !If etc.,
        # which the plain PyYAML loader can't construct. --unsafe still
        # checks the document is parseable, just doesn't try to construct
        # the unknown tags.
        args: ["--unsafe"]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        # Handles .yaml/.yml, .json, .md by default. CFN template is
        # excluded via .prettierignore because prettier's YAML parser
        # doesn't understand short-form CFN tags (!Ref / !Sub / ...).

  # ty (Astral's type checker) has no published pre-commit repo yet —
  # run it as a local hook against the project venv.
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
