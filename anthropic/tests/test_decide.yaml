id: preflight_allows
preflight: {body: {deny_reasons: []}}
config_overrides: {}
frame_update: {}
tail_kind: with_files
body: "{}"
expected: {action: allow, source: none, calls: [preflight]}
---
id: preflight_deny_wins_with_its_reasons
preflight: {body: {deny_reasons: [A file in this request is marked sensitive.]}}
config_overrides: {}
frame_update: {}
tail_kind: with_files
body: "{}"
expected: {action: deny, source: preflight}
---
# Preflight fails closed: a check it could not run answers with a reason of
# its own. So an empty list is a real all-clear and never reaches our fail
# mode, even with it set to deny.
id: preflight_empty_list_is_an_allow_not_a_fail_mode_case
preflight: {body: {deny_reasons: []}}
config_overrides: {verdict_fail_mode: deny}
frame_update: {}
tail_kind: with_files
body: "{}"
expected: {action: allow, source: none, calls: [preflight]}
---
# Ours, on the other hand: a non-200 is a check that gave us no answer.
id: preflight_transport_failure_fails_open_by_default
preflight: {status: 503}
config_overrides: {}
frame_update: {}
tail_kind: with_files
body: "{}"
expected: {action: allow, source: none}
---
id: preflight_transport_failure_fails_closed_when_configured
preflight: {status: 503}
config_overrides: {verdict_fail_mode: deny}
frame_update: {}
tail_kind: with_files
body: "{}"
expected: {action: deny, source: fail_mode}
---
id: preflight_timeout_takes_fail_mode
preflight: {error: true}
config_overrides: {verdict_fail_mode: deny}
frame_update: {}
tail_kind: with_files
body: "{}"
expected: {action: deny, source: fail_mode}
---
# The budget cancels the in-flight call, so this case runs in about 100 ms.
id: budget_exceeded_takes_fail_mode
preflight: {sleep: 2.0, body: {deny_reasons: []}}
config_overrides: {verdict_budget_ms: 100, verdict_fail_mode: deny}
frame_update: {}
tail_kind: with_files
body: "{}"
expected: {action: deny, source: fail_mode}
---
id: a_disabled_check_is_skipped_not_failed
preflight: null
config_overrides: {preflight_enabled: false, verdict_fail_mode: deny}
frame_update: {}
tail_kind: with_files
body: "{}"
expected: {action: allow, source: none, calls: []}
---
# Every round goes, files or not: the connection's AI policy judges the
# model and the tools too.
id: preflight_runs_without_files
preflight: {body: {deny_reasons: ["Your organization's AI policy does not allow this model."]}}
config_overrides: {}
frame_update: {}
tail_kind: without_files
body: "{}"
expected: {action: deny, source: preflight, calls: [preflight]}
---
# No tail event to send: a null actor.id cannot be resolved server-side,
# so the builder produced nothing and there is no invocation to hand over.
id: preflight_not_called_without_a_tail_event
preflight: null
config_overrides: {verdict_fail_mode: deny}
frame_update: {}
tail_kind: none
body: "{}"
expected: {action: allow, source: none, calls: []}
---
# A connection test carries no invocation to judge; the protocol wants allow.
id: config_test_bypasses_the_check
preflight: {body: {deny_reasons: ["no"]}}
config_overrides: {}
frame_update: {source: {application: config-test}}
tail_kind: with_files
body: "{}"
expected: {action: allow, source: bypass, calls: []}
---
id: unknown_type_bypasses_the_check
preflight: {body: {deny_reasons: ["no"]}}
config_overrides: {}
frame_update: {type: response}
tail_kind: with_files
body: "{}"
expected: {action: allow, source: bypass, calls: []}
---
id: marker_denies_when_not_shadowed
preflight: {body: {deny_reasons: []}}
config_overrides: {capture_deny_marker: SLASHID_DENY_ME}
frame_update: {}
tail_kind: with_files
body: '{"x": "SLASHID_DENY_ME"}'
expected: {action: deny, source: marker}
---
# Shadow mode is the default. The check still runs; allow is answered, and
# the composed deny is what the record will say.
id: shadow_mode_runs_the_check_but_allows
preflight: {body: {deny_reasons: ["no"]}}
config_overrides: {shadow_mode: true}
frame_update: {}
tail_kind: with_files
body: "{}"
expected:
  action: allow
  source: shadow
  composed_action: deny
  composed_source: preflight
  calls: [preflight]
---
id: a_configured_hash_denies
preflight: {body: {deny_reasons: []}}
config_overrides: {mock_denied_hashes: x}
frame_update: {}
tail_kind: with_files
body: "{}"
expected: {action: deny, source: mock-hash}
---
id: an_unconfigured_hash_denies_nothing
preflight: {body: {deny_reasons: []}}
config_overrides: {mock_denied_hashes: "deadbeef"}
frame_update: {}
tail_kind: with_files
body: "{}"
expected: {action: allow, source: none}
---
id: a_configured_hash_is_matched_case_insensitively
# An operator pasting a digest from a tool that prints uppercase must not
# be silently ignored; every source gives us lowercase hex.
preflight: {body: {deny_reasons: []}}
config_overrides: {mock_denied_hashes: X}
frame_update: {}
tail_kind: with_files
body: "{}"
expected: {action: deny, source: mock-hash}
---
id: a_configured_hash_denies_with_preflight_off
# Lets a test tenant drive the whole denial path below the verdict without
# depending on the graph having anything tagged sensitive.
preflight: null
config_overrides: {mock_denied_hashes: x, preflight_enabled: false}
frame_update: {}
tail_kind: with_files
body: "{}"
expected: {action: deny, source: mock-hash, calls: []}
---
id: a_round_with_nothing_hashable_is_unaffected
preflight: {body: {deny_reasons: []}}
config_overrides: {mock_denied_hashes: x}
frame_update: {}
tail_kind: without_files
body: "{}"
expected: {action: allow, source: none, calls: [preflight]}
