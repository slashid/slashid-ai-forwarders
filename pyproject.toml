[project]
name = "slashid-bedrock-forwarder"
version = "0.1.0"
description = "AWS Lambda forwarding Bedrock Model Invocation Logging events to SlashID NHI"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "SlashID" }]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    # boto3 is provided by the AWS Lambda Python runtime — we don't pack it
    # into the deploy zip, but the dev env needs it for type checking the
    # lazy SSM import in config.py.
    "boto3>=1.35",
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.1a8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slashid_bedrock_forwarder"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # flake8-bugbear
    "SIM",              # flake8-simplify
    "RUF",              # ruff-specific
]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
