id: server_side_executable_code_marks_server
req:
  contents:
    - role: user
      parts: [{text: "run 2+2"}]
response:
  candidates:
    - content:
        role: model
        parts:
          - {executableCode: {language: PYTHON, code: "print(2+2)"}}
          - {codeExecutionResult: {outcome: OUTCOME_OK, output: "4\n"}}
      finishReason: STOP
expected:
  input:
    messages:
      - role: user
        content: [{kind: text, text: "run 2+2", tool_is_error: false}]
  output:
    message:
      role: assistant
      content:
        - kind: tool_use
          tool_use_id: gemini-6fe9226ed2de2b4f
          tool_name: code_execution
          tool_input: {language: PYTHON, code: "print(2+2)"}
          tool_is_error: false
          tool_executor: server
        - kind: tool_result
          tool_use_id: gemini-6fe9226ed2de2b4f
          tool_output: {outcome: OUTCOME_OK, output: "4\n"}
          tool_is_error: false
          tool_executor: server
    stop_reason: end_turn
