[project]
name = "slashid-ai-forwarder-codex"
version = "0.1.0"
description = "Codex managed hook and per-user daemon: preflight verdicts and rollout events for SlashID NHI"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "SlashID" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "certifi",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    # The core's own dependencies and its ``local`` extra: the wheel carries
    # the core inside it, so they are listed here, not inherited.
    "pydantic-extra-types>=2.10",
    "tenacity>=9.0",
    "aiosqlite>=0.20",
    "platformdirs>=4.2",
]

[dependency-groups]
# The core is a workspace member that the wheel carries inside it, so it is a
# dependency only while developing.
dev = ["slashid-ai-forwarder-core[local]"]

[project.scripts]
slashid-ai-forwarder-codex = "slashid_codex.cli:main"

[tool.uv.sources]
slashid-ai-forwarder-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slashid_codex"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
