AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::LanguageExtensions
Description: |
  SlashID AgentCore tool-call check.

  Creates one Lambda that AgentCore Harness lifecycle hooks and Gateway
  interceptors invoke before a tool call runs and before its result reaches
  the model. The Lambda asks SlashID for a verdict and answers allow or deny.
  Nothing is pushed: the check only sends tool names, ids, identity and file
  references, never prompts, tool arguments or tool results.

Parameters:
  SlashIDEndpoint:
    Type: String
    Default: https://api.slashid.com
    Description: SlashID API endpoint.

  SlashIDPushToken:
    Type: String
    NoEcho: true
    Description: |
      Event-streaming bearer token for the connection. The server derives
      the org and connection IDs from this token, so we don't pass them
      separately.

  FailMode:
    Type: String
    Default: allow
    AllowedValues: [allow, deny]
    Description: |
      Answer when a check gets no answer from SlashID (unreachable, error,
      budget spent). "allow" keeps agents running through an outage; "deny"
      blocks every tool call until SlashID answers. The Harness hook's
      failureMode, set when you attach the hook, must match.

  ShadowMode:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: |
      Evaluate and log every check but answer allow. The Harness hook's
      failureMode should then be allow as well.

  HarnessHooksEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: When "false", Harness hook payloads are answered allow without calling SlashID.

  GatewayHooksEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: When "false", Gateway interceptor payloads are echoed without calling SlashID.

  BudgetMs:
    Type: Number
    Default: 3500
    MinValue: 100
    MaxValue: 9000
    Description: |
      Time one check may take, in milliseconds. Keep it under the hook's
      timeoutSeconds and the Lambda timeout (10 s each).

  GatewayRoleArns:
    Type: CommaDelimitedList
    Default: ""
    Description: |
      Execution role ARNs of the AgentCore Gateways that call this function
      as an interceptor; each is allowed to invoke it. Leave empty if no
      Gateway uses it. Only these roles and the AgentCore service (below)
      may invoke the function: anyone who can invoke it can supply the
      identity it reports.

  AllowAgentCoreServiceInvoke:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: |
      Let the AgentCore service principal (bedrock-agentcore.amazonaws.com)
      of this account invoke the function, for Harness lifecycle hooks.
      Whether Harness hooks need this resource policy, and the principal's
      name, are unconfirmed; set "false" if you only use Gateway
      interceptors.

  LambdaPackageS3Bucket:
    Type: String
    Description: S3 bucket containing the forwarder zip artifact.

  LambdaPackageS3Key:
    Type: String
    Description: S3 key for the forwarder zip artifact.

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365, 400, 545, 731, 1827, 3653]
    Description: Retention for the forwarder Lambda's own log group.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Description: |
      Python log level for the forwarder Lambda. Keep INFO or lower: the
      lines to alert on (fail_mode, pass_through, baggage_unverified) are
      INFO.

Conditions:
  HasGatewayRoles: !Not [!Equals [!Join ["", !Ref GatewayRoleArns], ""]]
  AllowService: !Equals [!Ref AllowAgentCoreServiceInvoke, "true"]

Resources:
  ForwarderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # Role lookups: a Harness's execution role, a Gateway's own role.
        - PolicyName: AgentCoreRoleLookup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-agentcore:GetHarness
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:harness/*
              - Effect: Allow
                Action: bedrock-agentcore:GetGateway
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*

  # Explicit Lambda log group so we control retention. Must exist before
  # the Lambda is created; otherwise Lambda auto-creates one with infinite
  # retention. The name matches Lambda's default convention.
  ForwarderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-forwarder
      RetentionInDays: !Ref LogRetentionDays

  ForwarderFunction:
    Type: AWS::Lambda::Function
    DependsOn: ForwarderLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-forwarder
      Runtime: python3.14
      Handler: slashid_agentcore_forwarder.handler.lambda_handler
      Role: !GetAtt ForwarderRole.Arn
      MemorySize: 512
      Timeout: 10
      Code:
        S3Bucket: !Ref LambdaPackageS3Bucket
        S3Key: !Ref LambdaPackageS3Key
      Environment:
        Variables:
          SLASHID_ENDPOINT: !Ref SlashIDEndpoint
          SLASHID_PUSH_TOKEN: !Ref SlashIDPushToken
          SLASHID_VERDICT_FAIL_MODE: !Ref FailMode
          SLASHID_SHADOW_MODE: !Ref ShadowMode
          SLASHID_HARNESS_HOOKS_ENABLED: !Ref HarnessHooksEnabled
          SLASHID_GATEWAY_HOOKS_ENABLED: !Ref GatewayHooksEnabled
          SLASHID_VERDICT_BUDGET_MS: !Ref BudgetMs
          LOG_LEVEL: !Ref LogLevel

  # Harness lifecycle hooks. Unconfirmed whether the service needs this
  # statement; SourceAccount keeps it to AgentCore resources of this account.
  HarnessHookInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: AllowService
    Properties:
      FunctionName: !Ref ForwarderFunction
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # One statement per Gateway role. &{GatewayRole} drops the ARN's
  # non-alphanumeric characters to form the logical ID.
  Fn::ForEach::GatewayInvoke:
    - GatewayRole
    - !Ref GatewayRoleArns
    - GatewayInvokePermission&{GatewayRole}:
        Type: AWS::Lambda::Permission
        Condition: HasGatewayRoles
        Properties:
          FunctionName: !Ref ForwarderFunction
          Action: lambda:InvokeFunction
          Principal: !Sub ${GatewayRole}

Outputs:
  ForwarderFunctionName:
    Value: !Ref ForwarderFunction
    Description: Name of the forwarder Lambda function.

  ForwarderFunctionArn:
    Value: !GetAtt ForwarderFunction.Arn
    Description: ARN of the forwarder Lambda function. Use it as the hook and interceptor Lambda ARN.
