[project]
name = "slashid-vertex-forwarder"
version = "0.1.4"
description = "GCP Cloud Function forwarding Vertex AI generateContent request-response logs to SlashID NHI"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "SlashID" }]
dependencies = [
    "slashid-ai-forwarder-core[gcs]",
    "functions-framework>=3.5",
    "google-cloud-bigquery>=3.20",
    "google-cloud-firestore>=2.16",
    "google-cloud-logging>=3.11",
    "google-cloud-secret-manager>=2.20",
    "httpx>=0.28",
]

[tool.uv.sources]
slashid-ai-forwarder-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slashid_vertex_forwarder"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
