id: text_stream_roundtrip
req:
  messages:
    - role: user
      content: [{type: text, text: "hi"}]
response:
  - {type: message_start, message: {usage: {input_tokens: 3}}}
  - type: content_block_start
    index: 0
    content_block: {type: text, text: ""}
  - {type: content_block_delta, index: 0, delta: {type: text_delta, text: "hel"}}
  - {type: content_block_delta, index: 0, delta: {type: text_delta, text: "lo"}}
  - {type: content_block_stop, index: 0}
  - {type: message_delta, delta: {stop_reason: end_turn}, usage: {output_tokens: 2}}
  - {type: message_stop}
expected:
  input:
    messages:
      - role: user
        content: [{kind: text, text: "hi", tool_is_error: false}]
  output:
    message:
      role: assistant
      content: [{kind: text, text: "hello", tool_is_error: false}]
    stop_reason: end_turn
---
id: tool_use_stream_marks_client_executor
req:
  messages:
    - role: user
      content: [{type: text, text: "search"}]
response:
  - {type: message_start, message: {usage: {input_tokens: 5}}}
  - type: content_block_start
    index: 0
    content_block: {type: tool_use, id: toolu_1, name: web_search}
  - type: content_block_delta
    index: 0
    delta: {type: input_json_delta, partial_json: '{"query"'}
  - type: content_block_delta
    index: 0
    delta: {type: input_json_delta, partial_json: ':"cats"}'}
  - {type: content_block_stop, index: 0}
  - {type: message_delta, delta: {stop_reason: tool_use}, usage: {output_tokens: 8}}
  - {type: message_stop}
expected:
  input:
    messages:
      - role: user
        content: [{kind: text, text: "search", tool_is_error: false}]
  output:
    message:
      role: assistant
      content:
        - kind: tool_use
          tool_use_id: toolu_1
          tool_name: web_search
          tool_input: {query: "cats"}
          tool_is_error: false
          tool_executor: client
    stop_reason: tool_use
---
id: thinking_stream_becomes_reasoning
req:
  messages:
    - role: user
      content: [{type: text, text: "hi"}]
response:
  - {type: message_start, message: {usage: {input_tokens: 3}}}
  - type: content_block_start
    index: 0
    content_block: {type: thinking, thinking: ""}
  - {type: content_block_delta, index: 0, delta: {type: thinking_delta, thinking: "user said hi"}}
  - {type: content_block_stop, index: 0}
  - type: content_block_start
    index: 1
    content_block: {type: text, text: ""}
  - {type: content_block_delta, index: 1, delta: {type: text_delta, text: "hello"}}
  - {type: content_block_stop, index: 1}
  - {type: message_delta, delta: {stop_reason: end_turn}, usage: {output_tokens: 2}}
  - {type: message_stop}
expected:
  input:
    messages:
      - role: user
        content: [{kind: text, text: "hi", tool_is_error: false}]
  output:
    message:
      role: assistant
      content:
        - kind: reasoning
          text: "user said hi"
          tool_is_error: false
        - kind: text
          text: "hello"
          tool_is_error: false
    stop_reason: end_turn
