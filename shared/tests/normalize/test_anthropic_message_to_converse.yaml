id: text_and_tool_use
body:
  type: message
  role: assistant
  content:
    - {type: text, text: "let me check"}
    - type: tool_use
      id: toolu_abc
      name: read
      input: {path: /x}
  stop_reason: tool_use
expected:
  output:
    message:
      role: assistant
      content:
        - {text: "let me check"}
        - toolUse:
            toolUseId: toolu_abc
            name: read
            input: {path: /x}
  stopReason: tool_use
---
id: thinking_folded_to_text
body:
  type: message
  role: assistant
  content:
    - {type: thinking, thinking: "reasoning...", signature: sig}
    - {type: text, text: answer}
  stop_reason: end_turn
expected:
  output:
    message:
      role: assistant
      content:
        - {text: "reasoning..."}
        - {text: answer}
  stopReason: end_turn
