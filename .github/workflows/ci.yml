name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        subproject: [shared, bedrock, vertex, anthropic, codex]
        # 3.12 is the supported floor, 3.14 is what the images and Lambda ship.
        python: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync workspace
        # Workspace-wide sync so each member can resolve its shared dep.
        # --locked: a plain sync silently rewrites a stale uv.lock, and
        # the anthropic Dockerfile runs ``uv sync --frozen``, so a stale
        # lock would fail the release build instead of this job.
        run: uv sync --all-groups --locked

      - name: Ruff (lint)
        if: matrix.python == '3.14'
        working-directory: ${{ matrix.subproject }}
        run: uv run ruff check .

      - name: Ruff (format check)
        if: matrix.python == '3.14'
        working-directory: ${{ matrix.subproject }}
        run: uv run ruff format --check .

      - name: ty (typecheck)
        if: matrix.python == '3.14'
        working-directory: ${{ matrix.subproject }}
        run: uv run ty check

      - name: pytest
        working-directory: ${{ matrix.subproject }}
        run: uv run pytest

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [vertex/deploy/terraform, anthropic/deploy/terraform]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform fmt (recursive)
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate
