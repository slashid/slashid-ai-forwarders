id: converse_list_content_concatenated
messages:
  - role: assistant
    content:
      - kind: tool_use
        tool_use_id: tu_conv
        tool_name: Read
        tool_input: {file_path: "/tmp/multi.txt"}
        tool_is_error: false
  - role: user
    content:
      - kind: tool_result
        tool_use_id: tu_conv
        tool_output:
          - {text: "     1\tfoo\n"}
          - {text: "     2\tbar\n"}
        tool_is_error: false
expected:
  - name: "/tmp/multi.txt"
    byte_length: 8   # "foo\nbar\n"
    media_type: text/plain
