id: read_cat_n_content_hashes_raw_bytes
messages:
  - role: assistant
    content:
      - kind: tool_use
        tool_use_id: tu_1
        tool_name: Read
        tool_input: {file_path: "/repo/main.py"}
        tool_is_error: false
  - role: user
    content:
      - kind: tool_result
        tool_use_id: tu_1
        tool_output: "     1\tline1\n     2\tline2\n"
        tool_is_error: false
expected:
  - name: "/repo/main.py"
    byte_length: 12   # "line1\nline2\n" = 12 bytes
    media_type: text/x-python
---
id: readfile_plain_content
messages:
