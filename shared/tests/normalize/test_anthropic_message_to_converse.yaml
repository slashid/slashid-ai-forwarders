id: unknown_block_skipped_silently
body:
  type: message
  role: assistant
  content:
    - {type: text, text: before}
    - {type: server_tool_use, id: srv_1, name: web_search}
    - {type: text, text: after}
  stop_reason: end_turn
expected:
  output:
    message:
      role: assistant
      content:
        - {text: before}
        - {text: after}
  stopReason: end_turn
