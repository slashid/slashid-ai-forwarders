[project]
name = "slashid-ai-forwarder-openai"
version = "0.1.0"
description = "ChatGPT Work remote hooks (an MCP preflight tool) and ChatGPT upload reports from the Compliance Logs Platform, forwarded to SlashID NHI"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "SlashID" }]
dependencies = [
    "slashid-ai-forwarder-core[gcp,local]",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
]

[tool.uv.sources]
slashid-ai-forwarder-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slashid_openai_forwarder"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
