name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        subproject: [shared, bedrock]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync workspace
        # Workspace-wide sync so bedrock can resolve its shared dep.
        run: uv sync --all-groups

      - name: Ruff (lint)
        working-directory: ${{ matrix.subproject }}
        run: uv run ruff check .

      - name: Ruff (format check)
        working-directory: ${{ matrix.subproject }}
        run: uv run ruff format --check .

      - name: ty (typecheck)
        working-directory: ${{ matrix.subproject }}
        run: uv run ty check

      - name: pytest
        working-directory: ${{ matrix.subproject }}
        run: uv run pytest
