[project]
name = "slashid-ai-forwarder-core"
version = "0.1.0"
description = "Shared library for SlashID AI-provider forwarders."
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "SlashID" }]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
    "pydantic-extra-types>=2.10",
]

[project.optional-dependencies]
# Bedrock Converse attachment resolution (S3 HeadObject + GetObject).
# Pulled in by ``slashid-ai-forwarder-core[converse]``; the Bedrock
# forwarder depends on this extra. Non-Converse forwarders (Vertex)
# don't need aioboto3.
converse = ["aioboto3>=15.0"]

# Vertex Gemini fileData attachment resolution (GCS HEAD + GET).
# Pulled in by ``slashid-ai-forwarder-core[gcs]``; the Vertex
# forwarder depends on this extra. Non-Vertex forwarders (Bedrock)
# don't need gcloud-aio-storage.
gcs = ["gcloud-aio-storage>=8.0"]

# ``platform.gcp``: Firestore checkpoints, Cloud Storage blobs and Cloud
# Scheduler's OIDC token. Pulled in by ``slashid-ai-forwarder-core[gcp]``.
gcp = ["google-cloud-firestore>=2.16", "google-cloud-storage>=2.18", "google-auth>=2.30"]

# ``platform.local``: checkpoints, a tick lease and blobs in a SQLite file or
# in memory, for development and tests. Pulled in by
# ``slashid-ai-forwarder-core[local]``.
local = ["aiosqlite>=0.20", "platformdirs>=4.2"]

[dependency-groups]
dev = [
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "platformdirs>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slashid_ai_forwarder_core"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # flake8-bugbear
    "SIM",              # flake8-simplify
    "RUF",              # ruff-specific
]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
