---
id: ping_and_message_stop_are_noops
body:
  - { type: ping }
  - type: content_block_start
    index: 0
    content_block: { type: text, text: "" }
  - { type: ping }
  - type: content_block_delta
    index: 0
    delta: { type: text_delta, text: hi }
  - { type: content_block_stop, index: 0 }
  - { type: message_stop }
expected:
  output:
    message:
      role: assistant
      content:
        - { text: hi }
